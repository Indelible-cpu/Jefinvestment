version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jef_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/jef_erp?schema=public
      - JWT_SECRET=supersecret_jwt_key_replace_in_production
      - JWT_EXPIRES_IN=1d
      - PORT=5000
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
