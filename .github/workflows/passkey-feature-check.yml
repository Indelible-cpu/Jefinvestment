name: Biometric Feature Validation

on:
  push:
    branches:
      - feature/biometric-passkey-login
    paths:
      - 'frontend/**'
      - 'passkey-worker/**'
      - '.github/workflows/passkey-feature-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'passkey-worker/**'

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend production build (no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build with passkey service disabled
        run: npm run build
        env:
          VITE_PASSKEY_API_URL: ''

  worker-validate:
    name: Passkey Worker typecheck and security tests (no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passkey-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
