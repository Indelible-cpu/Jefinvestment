name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Use Node v22 for the build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      # Install dependencies and build the frontend
      - name: Install Dependencies & Build
        run: |
          cd frontend
          echo "VITE_FIREBASE_API_KEY=AIzaSyDQx0Jq6BglTBel-IqXAA_lo8BWNMA3IjQ" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=jefinvestment-e1fc1.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=jefinvestment-e1fc1" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=jefinvestment-e1fc1.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=1088168942774" >> .env
          echo "VITE_FIREBASE_APP_ID=1:1088168942774:web:dc5461bed599c344f3da17" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=G-9J35QQ7V6C" >> .env
          npm install
          npm run build
          
      # Deploy to Firebase Hosting manually using the official CLI
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JEFINVESTMENT }}'
        run: |
          # Save the secret to a temporary file for the CLI
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/service-account.json"
          
          # Install the Firebase CLI globally
          npm install -g firebase-tools
          
          # Deploy with debug logs enabled so we can see exactly what's wrong if it fails
          firebase deploy --only hosting --project jefinvestment-e1fc1 --debug
