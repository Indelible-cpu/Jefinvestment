name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 to avoid deprecation warnings on GitHub Actions runners
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Install dependencies and build the frontend
      - name: Install Dependencies & Build
        run: |
          cd frontend
          echo "VITE_FIREBASE_API_KEY=AIzaSyDQx0Jq6BglTBel-IqXAA_lo8BWNMA3IjQ" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=jefinvestment-e1fc1.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=jefinvestment-e1fc1" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=jefinvestment-e1fc1.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=1088168942774" >> .env
          echo "VITE_FIREBASE_APP_ID=1:1088168942774:web:dc5461bed599c344f3da17" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=G-9J35QQ7V6C" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=6Ld1VKctAAAAAKumuGcc_7c7M7kn_EE9evkv7Duo" >> .env
          npm install
          npm run build

      # Set up Google credentials for Firebase CLI
      - name: Set up Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JEFINVESTMENT }}'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${PWD}/service-account.json" >> $GITHUB_ENV

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Deploy the built frontend to Firebase Hosting
      - name: Deploy Hosting
        run: firebase deploy --only hosting --project jefinvestment-e1fc1

      # Deploy Firestore security rules (separate step so a rules error doesn't block hosting)
      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project jefinvestment-e1fc1
